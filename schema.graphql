type PoolManager @entity(immutable: false) {
  # poolManager address
  id: ID!
  # amount of pools created
  poolCount: BigInt!
  # amoutn of transactions all time
  txCount: BigInt!
  # total volume all time in derived USD
  totalVolumeUSD: BigDecimal!
  # total volume all time in derived ETH
  totalVolumeETH: BigDecimal!
  # LP fees all time in USD (Uniswap's and Ascnt's cuts excluded)
  totalLpFeesUSD: BigDecimal!
  # LP fees all time in ETH
  totalLpFeesETH: BigDecimal!
  # all volume even through less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # TVL derived in USD
  totalValueLockedUSD: BigDecimal!
  # TVL derived in ETH
  totalValueLockedETH: BigDecimal!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # TVL derived in ETH untracked
  totalValueLockedETHUntracked: BigDecimal!
  # Ascnt hooks whitelisted pools only
  ascntPools: [Pool!]!
  ascntPoolCount: BigInt!
  # current owner of the factory
  owner: ID!
}

# stores for USD calculations
type Bundle @entity(immutable: false) {
  id: ID!
  # price of ETH in usd
  ethPriceUSD: BigDecimal!
}

type Token @entity(immutable: false) {
  # token address
  id: ID!
  # token symbol
  symbol: String!
  # token name
  name: String!
  # token decimals
  decimals: BigInt!
  # token total supply
  totalSupply: BigInt!
  # volume in token units
  volume: BigDecimal!
  # volume in derived USD
  volumeUSD: BigDecimal!
  # volume in USD even on pools with less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # LP fees in USD across the pools that include this token
  lpFeesUSD: BigDecimal!
  # transactions across all pools that include this token
  txCount: BigInt!
  # number of pools containing this token
  poolCount: BigInt!
  # liquidity across all pools in token units
  totalValueLocked: BigDecimal!
  # liquidity across all pools in derived USD
  totalValueLockedUSD: BigDecimal!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # price in the chain's native token: 1 for ETH/WETH, 1 / ethPriceUSD for the
  # chain's stablecoinAddresses, otherwise from the largest whitelist pool swapped
  # in the last 24h that clears the USD floor (README "Token pricing").
  # Note: for chains where ETH is not the native token, this will be the derived
  # price of that chain's native token, effectively, this should be renamed
  # derivedNative
  derivedETH: BigDecimal!
  # pools token is in that are white listed for USD pricing
  whitelistPools: [Pool!]!
  # derived fields
  tokenDayData: [TokenDayData!]! @derivedFrom(field: "token")
}

type Pool @entity(immutable: false) {
  # pool address
  id: ID!
  # creation
  createdAtTimestamp: BigInt!
  # block pool was created at
  createdAtBlockNumber: BigInt!
  # token0
  token0: Token!
  # token1
  token1: Token!
  # The pool key's fee from Initialize, in pips (1e6 = 100%): the static tier, or
  # the dynamic-fee flag 8388608 (0x800000) on dynamic pools. Never changed by
  # swaps, so a PoolKey built from it hashes to this pool. README "Pool fee and
  # TVL semantics".
  feeTier: BigInt!
  # dynamic fee pool (feeTier is the flag; poolFee carries the rate)
  isDynamicFee: Boolean!
  # --- rates of the last swap, in pips; 0 on dynamic pools until the first swap ---
  # Rate the pool charged before Uniswap's cut: feeTier on static pools; on Ascnt
  # pools the dynamic fee the hook chose, LP share + Ascnt's cut (equals
  # dynamicFeePips); on other dynamic-fee pools the LP fee recovered from Swap.fee.
  poolFee: BigInt!
  # LP revenue rate: poolFee minus Ascnt's cut, so equal to poolFee on every pool
  # that is not an Ascnt pool. Recovered from Swap.fee and the Uniswap rate of the
  # swap's direction (lpFeeFromSwapFee).
  lpFee: BigInt!
  # Ascnt's cut: poolFee - lpFee. 0 off Ascnt pools.
  ascntProtocolFee: BigInt!
  # Uniswap's protocol fee on this pool in pips of gross swap input, per swap
  # direction, from PoolManager.ProtocolFeeUpdated (packed uint24: low 12 bits
  # zeroForOne, high 12 bits oneForZero). v4-core initialises pools at 0. This
  # is Uniswap's fee, unrelated to Ascnt's ascntProtocolFees* below.
  uniswapProtocolFeeZeroForOne: BigInt!
  uniswapProtocolFeeOneForZero: BigInt!
  # Everything the swapper paid on the last swap in pips: poolFee + Uniswap's
  # rate for that direction. Not the Swap event's own fee on Ascnt pools, where
  # the hook takes its cut outside the pool's fee.
  totalSwapFee: BigInt!
  # in range liquidity
  liquidity: BigInt!
  # current price tracker
  sqrtPrice: BigInt!
  # token0 per token1
  token0Price: BigDecimal!
  # token1 per token0
  token1Price: BigDecimal!
  # current tick
  tick: BigInt
  # tick spacing
  tickSpacing: BigInt!
  # current observation index
  observationIndex: BigInt!
  # all time token0 swapped
  volumeToken0: BigDecimal!
  # all time token1 swapped
  volumeToken1: BigDecimal!
  # all time USD swapped
  volumeUSD: BigDecimal!
  # all time USD swapped, unfiltered for unreliable USD pools
  untrackedVolumeUSD: BigDecimal!
  # LP fees in USD: tracked volume x (Swap.fee - Uniswap's rate) / 1e6, exactly
  # the share Pool.swap credits to feeGrowthGlobal. Uniswap's and Ascnt's cuts
  # are accumulated separately.
  lpFeesUSD: BigDecimal!
  # LP fees per token, decimal units; each swap's fee lands on its input token
  lpFeesToken0: BigDecimal!
  lpFeesToken1: BigDecimal!
  # Uniswap's protocol cut: tracked volume x its rate, and per input token
  uniswapProtocolFeesUSD: BigDecimal!
  uniswapProtocolFeesToken0: BigDecimal!
  uniswapProtocolFeesToken1: BigDecimal!
  # all time number of transactions
  txCount: BigInt!
  # block timestamp of the last swap; null until the first. Token pricing prefers
  # pools swapped within the last 24h (README "Token pricing").
  lastSwapTimestamp: BigInt
  # token0 backing liquidity across all ticks, fees excluded (README "Pool fee
  # and TVL semantics"); equals integrating Tick.liquidityNet at sqrtPrice
  totalValueLockedToken0: BigDecimal!
  # token1 backing liquidity across all ticks, fees excluded
  totalValueLockedToken1: BigDecimal!
  # tvl derived ETH
  totalValueLockedETH: BigDecimal!
  # tvl USD
  totalValueLockedUSD: BigDecimal!
  # true when TVL is sourced from an external hook rather than derived pricing
  isExternalLiquidity: Boolean!
  # TVL derived in USD untracked
  totalValueLockedUSDUntracked: BigDecimal!
  # Fields used to help derived relationship
  liquidityProviderCount: BigInt! # used to detect new exchanges
  # hourly snapshots of pool data
  poolHourData: [PoolHourData!]! @derivedFrom(field: "pool")
  # daily snapshots of pool data
  poolDayData: [PoolDayData!]! @derivedFrom(field: "pool")
  # hooks address
  hooks: String!
  # the Hook entity behind `hooks`, when the subgraph has one: factory-deployed
  # (HookDeployed) or legacy (SubgraphConfig.legacyHookAddresses). Null for hookless
  # pools and third-party hooks. hook.deprecated / hook.legacy are the pool's status.
  hook: Hook
  # derived fields
  modifyLiquiditys: [ModifyLiquidity!]! @derivedFrom(field: "pool")
  swaps: [Swap!]! @derivedFrom(field: "pool")
  ticks: [Tick!]! @derivedFrom(field: "pool")
  # PositionManager positions in the pool (README "Positions")
  positions: [Position!]! @derivedFrom(field: "pool")
  # --- Ascnt-specific fields ---
  # Ascnt pool flag. Set when the pool's hook emits PoolInitialized, or at
  # Initialize on a legacy hook (README "Legacy hooks"); cleared when governance
  # removes that hook from the subscriber registry (SubscriberRemoved), after
  # which the Ascnt swap overlay below stops accruing for this pool.
  isAscntPool: Boolean!
  # block / timestamp at which isAscntPool was cleared by SubscriberRemoved
  # (null while still an Ascnt pool, or never one). Nullable for graft compatibility.
  ascntRemovedAtBlock: BigInt
  ascntRemovedAtTimestamp: BigInt
  # is pool configured
  configured: Boolean
  # min fee
  minFee: BigInt
  # max fee
  maxFee: BigInt
  # fallback fee (legacy/MVP hooks only)
  fallbackFee: BigInt
  # time decay length
  timeDecayLength: BigInt
  # illiq scale
  illiqScale: BigInt
  # upper bound of the min-fee range (gov-version hooks)
  maxMinFee: BigInt
  # JIT liquidity lock in blocks (gov-version hooks)
  jitLockBlocks: BigInt
  # midpoint-fee leg weight on imbalance-increasing legs, in pips (gov-version hooks)
  kPips: BigInt
  # midpoint-fee leg weight on imbalance-decreasing legs, in pips (gov-version hooks)
  cPips: BigInt
  # Ascnt's cut taken by the hook (ProtocolFeeTaken / ProtocolFeeTakenAsClaims),
  # cumulative, in decimal token units. It lands on the swap's unspecified
  # currency, so exactly one side moves per take.
  ascntProtocolFeesToken0: BigDecimal!
  ascntProtocolFeesToken1: BigDecimal!
  # Ascnt's cut in USD, valued at the moment each take happened
  ascntProtocolFeesUSD: BigDecimal!
  # protocol fee collections on this pool
  protocolFeeCollections: [ProtocolFeeCollection!]! @derivedFrom(field: "pool")
  # --- Ascnt before-swap fields ---
  # price before swap
  sqrtPriceX96Before: BigInt
  # illiq before swap
  illiqBefore: BigInt
  # estimated volume in token1 before swap
  estimatedVolume1: BigInt
  # estimated price impact before swap
  estimatedPriceImpact: BigInt
  # decayed cumulative price impact before swap
  decayedCumPriceImpact: BigInt
  # dynamic fee pips applied to swap
  dynamicFeePips: BigInt
  # --- Ascnt after-swap fields ---
  # price impact after swap
  priceImpact: BigInt
  # cumulative price impact after swap
  cumPriceImpact: BigInt
  # illiquidity ratio after swap
  illiq: BigInt
  # relative error between estimated and real price impact
  priceImpactError: BigInt
}

type Tick @entity(immutable: false) {
  # format: <pool address>#<tick index>
  id: ID!
  # pool address
  poolAddress: String
  # tick index
  tickIdx: BigInt!
  # pointer to pool
  pool: Pool!
  # total liquidity pool has as tick lower or upper
  liquidityGross: BigInt!
  # how much liquidity changes when tick crossed
  liquidityNet: BigInt!
  # calculated price of token0 of tick within this pool - constant
  price0: BigDecimal!
  # calculated price of token1 of tick within this pool - constant
  price1: BigDecimal!
  # created time
  createdAtTimestamp: BigInt!
  # created block
  createdAtBlockNumber: BigInt!
}

type Transaction @entity(immutable: true) {
  # txn hash
  id: ID!
  # block txn was included in
  blockNumber: BigInt!
  # timestamp txn was confirmed
  timestamp: BigInt!
  # gas used during txn execution
  gasUsed: BigInt!
  gasPrice: BigInt!
  # derived values
  modifyLiquiditys: [ModifyLiquidity]! @derivedFrom(field: "transaction")
  swaps: [Swap]! @derivedFrom(field: "transaction")
  transfers: [Transfer]! @derivedFrom(field: "transaction")
  subscriptions: [Subscribe]! @derivedFrom(field: "transaction")
  unsubscriptions: [Unsubscribe]! @derivedFrom(field: "transaction")
}

type Swap @entity(immutable: false) {
  # transaction hash + "#" + index in swaps Transaction array
  id: ID!
  # pointer to transaction
  transaction: Transaction!
  # timestamp of transaction
  timestamp: BigInt!
  # pool swap occured within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # sender of the swap
  sender: Bytes!
  # recipient of the swap
  # recipient: Bytes
  # txn origin
  origin: Bytes! # the EOA that initiated the txn
  # delta of token0 swapped
  amount0: BigDecimal!
  # delta of token1 swapped
  amount1: BigDecimal!
  # derived info
  amountUSD: BigDecimal!
  # The sqrt(price) of the pool after the swap, as a Q64.96
  sqrtPriceX96: BigInt!
  # the tick after the swap
  tick: BigInt!
  # index within the txn
  logIndex: BigInt
  # --- fee rates of this swap, in pips (see the Pool fields of the same name) ---
  # rate the pool charged before Uniswap's cut
  poolFee: BigInt!
  # LP revenue rate: poolFee minus Ascnt's cut
  lpFee: BigInt!
  # Ascnt's cut: poolFee - lpFee (0 off Ascnt pools)
  ascntProtocolFee: BigInt!
  # Uniswap's protocol fee for this swap's direction
  uniswapProtocolFee: BigInt!
  # everything the swapper paid: poolFee + uniswapProtocolFee
  totalSwapFee: BigInt!
  # --- Ascnt-specific fields ---
  # sqrt(price) of pool before swap, as Q64.96
  sqrtPriceX96Before: BigInt
  # illiquidity ratio before swap
  illiqBefore: BigInt
  # estimated volume in token1 before swap
  estimatedVolume1: BigInt
  # estimated price impact before swap
  estimatedPriceImpact: BigInt
  # decayed cumulative price impact before swap
  decayedCumPriceImpact: BigInt
  # dynamic fee in pips applied to swap
  dynamicFeePips: BigInt
  # real price impact after swap
  priceImpact: BigInt
  # cumulative price impact after swap
  cumPriceImpact: BigInt
  # real illiquidity ratio after swap
  illiq: BigInt
  # relative error between estimated and real price impact
  priceImpactError: BigInt
}

type ModifyLiquidity @entity(immutable: true) {
  # transaction hash + "#" + index in mints Transaction array
  id: ID!
  # which txn the ModifyLiquidity was included in
  transaction: Transaction!
  # time of txn
  timestamp: BigInt!
  # pool position is within
  pool: Pool!
  # allow indexing by tokens
  token0: Token!
  # allow indexing by tokens
  token1: Token!
  # owner of position where liquidity modified to
  # owner: Bytes
  # the address that modified the liquidity
  sender: Bytes
  # txn origin
  origin: Bytes! # the EOA that initiated the txn
  # liquidity delta: positive for an add, negative for a remove
  amount: BigInt!
  # token0 moved at the pool's price when the event fired, signed like `amount`
  amount0: BigDecimal!
  # token1 moved, signed like `amount`
  amount1: BigDecimal!
  # amount0 and amount1 valued at the tokens' derived prices of the moment, signed
  # like `amount`; 0 while neither token has a price
  amountUSD: BigDecimal!
  # pool sqrt(price) (Q64.96) and tick when the event fired; liquidity changes do
  # not move price, so these are the exact prices the amounts were computed at
  sqrtPrice: BigInt!
  tick: BigInt!
  # lower tick of the position
  tickLower: BigInt!
  # upper tick of the position
  tickUpper: BigInt!
  # index within the txn
  logIndex: BigInt
  # pointer to position (only set when routed through PositionManager)
  position: Position
}

# Data accumulated and condensed into day stats for each pool
type PoolDayData @entity(immutable: false) {
  # timestamp rounded to current day by dividing by 86400
  id: ID!
  # timestamp rounded to current day by dividing by 86400
  date: Int!
  # pointer to pool
  pool: Pool!
  # in range liquidity at end of period
  liquidity: BigInt!
  # current price tracker at end of period
  sqrtPrice: BigInt!
  # price of token0 - derived from sqrtPrice
  token0Price: BigDecimal!
  # price of token1 - derived from sqrtPrice
  token1Price: BigDecimal!
  # current tick at end of period
  tick: BigInt
  # tvl derived in USD at end of period
  tvlUSD: BigDecimal!
  # volume in token0
  volumeToken0: BigDecimal!
  # volume in token1
  volumeToken1: BigDecimal!
  # volume in USD
  volumeUSD: BigDecimal!
  # LP fees in USD
  lpFeesUSD: BigDecimal!
  # Uniswap's protocol cut in USD
  uniswapProtocolFeesUSD: BigDecimal!
  # Ascnt's cut in USD, valued when taken
  ascntProtocolFeesUSD: BigDecimal!
  # number of transactions during period
  txCount: BigInt!
  # number of swaps during period
  swapCount: BigInt!
  # OHLC of token0 price, written by swaps ONLY: null until the period's first
  # swap (liquidity events update state snapshots but never candles, so a
  # candle's existence implies real trading). open = the entering price (the
  # previous close the pool sat at), so candles are gapless across periods.
  # opening price of token0 (null until first swap of period)
  open: BigDecimal
  # high price of token0 (null until first swap of period)
  high: BigDecimal
  # low price of token0 (null until first swap of period)
  low: BigDecimal
  # close price of token0 (null until first swap of period)
  close: BigDecimal
  # ordinal (blockNumber * 2^32 + logIndex) of the swap that last set close.
  # Only swaps advance it (null until the period's first swap); guards close
  # against a lower-ordinal (earlier) swap overwriting a higher-ordinal (later)
  # one if triggers ever replay out of order.
  closeOrdinal: BigInt
  # --- Ascnt-specific fields ---
  # sum of dynamic fee pips across Ascnt swaps in this period
  sumDynamicFeePips: BigInt!
  # max dynamic fee pips observed across Ascnt swaps in this period
  maxDynamicFeePips: BigInt!
  # the Ascnt swap that produced maxDynamicFeePips (null until first Ascnt swap in period)
  maxDynamicFeeSwap: Swap
}

# hourly stats tracker for pool
type PoolHourData @entity(immutable: false) {
  # format: <pool address>-<timestamp>
  id: ID!
  # unix timestamp for start of hour
  periodStartUnix: Int!
  # pointer to pool
  pool: Pool!
  # in range liquidity at end of period
  liquidity: BigInt!
  # current price tracker at end of period
  sqrtPrice: BigInt!
  # price of token0 - derived from sqrtPrice
  token0Price: BigDecimal!
  # price of token1 - derived from sqrtPrice
  token1Price: BigDecimal!
  # current tick at end of period
  tick: BigInt
  # tvl derived in USD at end of period
  tvlUSD: BigDecimal!
  # volume in token0
  volumeToken0: BigDecimal!
  # volume in token1
  volumeToken1: BigDecimal!
  # volume in USD
  volumeUSD: BigDecimal!
  # LP fees in USD
  lpFeesUSD: BigDecimal!
  # Uniswap's protocol cut in USD
  uniswapProtocolFeesUSD: BigDecimal!
  # Ascnt's cut in USD, valued when taken
  ascntProtocolFeesUSD: BigDecimal!
  # number of transactions during period
  txCount: BigInt!
  # number of swaps during period
  swapCount: BigInt!
  # OHLC of token0 price, written by swaps ONLY; see PoolDayData.open.
  # opening price of token0 (null until first swap of period)
  open: BigDecimal
  # high price of token0 (null until first swap of period)
  high: BigDecimal
  # low price of token0 (null until first swap of period)
  low: BigDecimal
  # close price of token0 (null until first swap of period)
  close: BigDecimal
  # ordinal (blockNumber * 2^32 + logIndex) of the swap that last set close.
  # Only swaps advance it (null until the period's first swap); guards close
  # against a lower-ordinal (earlier) swap overwriting a higher-ordinal (later)
  # one if triggers ever replay out of order.
  closeOrdinal: BigInt
  # --- Ascnt-specific fields ---
  # sum of dynamic fee pips across Ascnt swaps in this period
  sumDynamicFeePips: BigInt!
  # max dynamic fee pips observed across Ascnt swaps in this period
  maxDynamicFeePips: BigInt!
  # the Ascnt swap that produced maxDynamicFeePips (null until first Ascnt swap in period)
  maxDynamicFeeSwap: Swap
}

type TokenDayData @entity(immutable: false) {
  # token address concatendated with date
  id: ID!
  # timestamp rounded to current day by dividing by 86400
  date: Int!
  # pointer to token
  token: Token!
  # volume in token units
  volume: BigDecimal!
  # volume in derived USD
  volumeUSD: BigDecimal!
  # volume in USD even on pools with less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # liquidity across all pools in token units
  totalValueLocked: BigDecimal!
  # liquidity across all pools in derived USD
  totalValueLockedUSD: BigDecimal!
  # price at end of period in USD
  priceUSD: BigDecimal!
  # LP fees in USD
  lpFeesUSD: BigDecimal!
  # OHLC of token USD price, written by swaps ONLY; see PoolDayData.open.
  # opening price USD (null until first swap of period)
  open: BigDecimal
  # high price USD (null until first swap of period)
  high: BigDecimal
  # low price USD (null until first swap of period)
  low: BigDecimal
  # close price USD (null until first swap of period)
  close: BigDecimal
  # ordinal (blockNumber * 2^32 + logIndex) of the swap that last set close;
  # only swaps advance it (null until the period's first swap); see
  # PoolDayData.closeOrdinal.
  closeOrdinal: BigInt
}

type TokenHourData @entity(immutable: false) {
  # token address concatendated with date
  id: ID!
  # unix timestamp for start of hour
  periodStartUnix: Int!
  # pointer to token
  token: Token!
  # volume in token units
  volume: BigDecimal!
  # volume in derived USD
  volumeUSD: BigDecimal!
  # volume in USD even on pools with less reliable USD values
  untrackedVolumeUSD: BigDecimal!
  # liquidity across all pools in token units
  totalValueLocked: BigDecimal!
  # liquidity across all pools in derived USD
  totalValueLockedUSD: BigDecimal!
  # price at end of period in USD
  priceUSD: BigDecimal!
  # LP fees in USD
  lpFeesUSD: BigDecimal!
  # OHLC of token USD price, written by swaps ONLY; see PoolDayData.open.
  # opening price USD (null until first swap of period)
  open: BigDecimal
  # high price USD (null until first swap of period)
  high: BigDecimal
  # low price USD (null until first swap of period)
  low: BigDecimal
  # close price USD (null until first swap of period)
  close: BigDecimal
  # ordinal (blockNumber * 2^32 + logIndex) of the swap that last set close;
  # only swaps advance it (null until the period's first swap); see
  # PoolDayData.closeOrdinal.
  closeOrdinal: BigInt
}

type Position @entity(immutable: false) {
  # tokenId
  id: ID!
  # tokenId
  tokenId: BigInt!
  # address of current owner
  owner: String!
  # the EOA that minted the position
  origin: String!
  # created time
  createdAtTimestamp: BigInt!
  # --- state folded from the PositionManager-routed ModifyLiquidity events
  # (README "Positions"). Principal only: v4 emits no fee amounts, so the fees a
  # modify pays out appear nowhere here. ---
  # pool, range and entry price, set by the first ModifyLiquidity (the mint) and
  # never changed; null for the one log between the NFT Transfer and that event
  pool: Pool
  tickLower: BigInt
  tickUpper: BigInt
  # pool sqrt(price) (Q64.96) and tick at the mint
  mintSqrtPrice: BigInt
  mintTick: BigInt
  # liquidity in the position now: running sum of ModifyLiquidity.amount
  liquidity: BigInt!
  # ModifyLiquidity events seen, zero-delta ones (fee collections) included
  modifyCount: BigInt!
  # principal added by positive deltas / removed by negative ones, decimal units,
  # both as positive numbers; deposited - withdrawn is the net principal
  depositedToken0: BigDecimal!
  depositedToken1: BigDecimal!
  withdrawnToken0: BigDecimal!
  withdrawnToken1: BigDecimal!
  # the same flows valued at each event's own prices (derivedETH, Bundle.ethPriceUSD);
  # depositedUSD - withdrawnUSD is the net cost basis, likewise in ETH
  depositedUSD: BigDecimal!
  withdrawnUSD: BigDecimal!
  depositedETH: BigDecimal!
  withdrawnETH: BigDecimal!
  # timestamp of the latest ModifyLiquidity
  lastModifiedTimestamp: BigInt
  # timestamp of the removal that took liquidity to 0; null while liquidity > 0
  # (cleared again when liquidity is re-added)
  closedAtTimestamp: BigInt
  # one snapshot per ModifyLiquidity (id suffix = modifyCount after it)
  snapshots: [PositionSnapshot!]! @derivedFrom(field: "position")
  # subscribe events
  subscriptions: [Subscribe!]! @derivedFrom(field: "position")
  # unsubscription events
  unsubscriptions: [Unsubscribe!]! @derivedFrom(field: "position")
  # transfer events
  transfers: [Transfer!]! @derivedFrom(field: "position")
  # liquidity modifications for this position
  modifyLiquiditys: [ModifyLiquidity!]! @derivedFrom(field: "position")
}

# A PositionManager position's state after each of its ModifyLiquidity events: the
# history behind entry price, cost basis and per-leg capital. Principal only, see
# Position and README "Positions".
type PositionSnapshot @entity(immutable: true) {
  # position id + "#" + Position.modifyCount after this event (1 for the mint)
  id: ID!
  position: Position!
  pool: Pool!
  # owner at the time of the event
  owner: String!
  transaction: Transaction!
  # the ModifyLiquidity row this snapshot follows
  modifyLiquidity: ModifyLiquidity!
  timestamp: BigInt!
  blockNumber: BigInt!
  logIndex: BigInt!
  # the event's liquidity delta and the position's liquidity after it
  liquidityDelta: BigInt!
  liquidity: BigInt!
  # principal moved by this event, signed like liquidityDelta, decimal units
  amount0: BigDecimal!
  amount1: BigDecimal!
  amountUSD: BigDecimal!
  amountETH: BigDecimal!
  # the Position accumulators after this event
  depositedToken0: BigDecimal!
  depositedToken1: BigDecimal!
  withdrawnToken0: BigDecimal!
  withdrawnToken1: BigDecimal!
  depositedUSD: BigDecimal!
  withdrawnUSD: BigDecimal!
  depositedETH: BigDecimal!
  withdrawnETH: BigDecimal!
  # pool sqrt(price) (Q64.96) and tick when the event fired
  sqrtPrice: BigInt!
  tick: BigInt!
  # the prices the USD / ETH figures were computed at
  ethPriceUSD: BigDecimal!
  token0DerivedETH: BigDecimal!
  token1DerivedETH: BigDecimal!
}

type Subscribe @entity(immutable: true) {
  # transaction hash + '-' + log index
  id: ID!
  # token id of position subscribed to
  tokenId: BigInt!
  # address of subscriber
  address: String!
  # pointer to transaction
  transaction: Transaction!
  # log index
  logIndex: BigInt!
  # time of tx
  timestamp: BigInt!
  # the EOA that initiated the tx
  origin: String!
  # pointer to position
  position: Position!
}

type Unsubscribe @entity(immutable: true) {
  # transaction hash + '-' + log index
  id: ID!
  # token id of position unsubscribed from
  tokenId: BigInt!
  # address of unsubscriber
  address: String!
  # pointer to transaction
  transaction: Transaction!
  # log index
  logIndex: BigInt!
  # time of tx
  timestamp: BigInt!
  # the EOA that initiated the tx
  origin: String!
  # pointer to position
  position: Position!
}

type Transfer @entity(immutable: true) {
  # transaction hash + '-' + log index
  id: ID!
  # token id of position
  tokenId: BigInt!
  # address of previous owner
  from: String!
  # address of new owner
  to: String!
  # pointer to transaction
  transaction: Transaction!
  # log index
  logIndex: BigInt!
  # time of tx
  timestamp: BigInt!
  # the EOA that initiated the tx
  origin: String!
  # pointer to position
  position: Position!
}

# A hook contract deployed through the HookFactory (or referenced by governance)
type Hook @entity(immutable: false) {
  # hook contract address
  id: ID!
  # CREATE2 salt used by the factory (empty if hook was not seen via HookDeployed)
  salt: Bytes!
  # factory that deployed the hook (zero address if not seen via HookDeployed)
  factory: Bytes!
  # deploy time (first Initialize seen on it for a legacy hook)
  createdAtTimestamp: BigInt!
  # deploy block (first Initialize seen on it for a legacy hook)
  createdAtBlockNumber: BigInt!
  # factory deprecation flag (HookDeprecationChanged); true from creation on a legacy hook
  deprecated: Boolean!
  # pre-factory hook (the MVP and price-impact hooks before the HookFactory): no
  # HookDeployed, no on-chain deprecation attestation. Listed per chain in
  # SubgraphConfig.legacyHookAddresses; created at the first Initialize on it,
  # deprecated from the start, and every pool on it is an Ascnt pool from
  # Initialize so lifetime volume and fees keep counting. README "Legacy hooks".
  legacy: Boolean!
  # per-hook add-liquidity pause set by governance
  addLiquidityPaused: Boolean!
  # hook-local cached protocol fee bps, mirroring AscntBaseHook.protocolFeeBps.
  # Seeded at HookDeployed from the factory's governance bps (the constructor
  # copies that value without emitting an event), then overwritten by every
  # ProtocolFeeBpsCached. Null only for hooks first seen without a HookDeployed.
  cachedProtocolFeeBps: BigInt
  # registered as a governance fee-bps subscriber
  isSubscriber: Boolean!
  # block / timestamp of SubscriberRemoved for this hook (null if never removed;
  # removal is one-way on-chain, and legacy hooks were never registered).
  # Nullable for graft compatibility.
  subscriberRemovedAtBlock: BigInt
  subscriberRemovedAtTimestamp: BigInt
  # number of failed governance bps pushes to this hook
  subscriberPushFailCount: BigInt!
  # protocol fee collections taken by this hook
  protocolFeeCollections: [ProtocolFeeCollection!]! @derivedFrom(field: "hook")
  # pools initialised on this hook (Pool.hook)
  pools: [Pool!]! @derivedFrom(field: "hook")
}

# Current governance state (one entity per AscntGovernance contract)
type Protocol @entity(immutable: false) {
  # governance contract address
  id: ID!
  # treasury receiving protocol fees
  treasury: Bytes
  # protocol fee in bps
  protocolFeeBps: BigInt!
  # global add-liquidity pause
  addLiquidityPaused: Boolean!
  # governance owner
  owner: Bytes
  # pauser role
  pauser: Bytes
  # active timelock
  timelock: Bytes
  # pending timelock transfer target (null when no transfer in flight)
  pendingTimelock: Bytes
  # expiry of the pending timelock transfer
  pendingTimelockExpiry: BigInt
  # pool deployer role
  poolDeployer: Bytes
  # canonical hook factory
  hookFactory: Bytes
}

# One ProtocolFeeTaken / ProtocolFeeTakenAsClaims event
type ProtocolFeeCollection @entity(immutable: true) {
  # transaction hash + '-' + log index
  id: ID!
  # hook that took the fee
  hook: Hook!
  # pool the fee came from
  pool: Pool!
  # treasury recipient
  treasury: Bytes!
  # nominal token0 amount (exactly one of amount0/amount1 is nonzero)
  amount0: BigInt!
  # nominal token1 amount
  amount1: BigInt!
  # true when delivered as ERC-6909 claims after a reverted treasury transfer
  asClaims: Boolean!
  # pointer to transaction
  transaction: Transaction!
  # time of tx
  timestamp: BigInt!
  # log index
  logIndex: BigInt!
}

type SwapStaging @entity(immutable: false) {
  # id = txHash + '-' + poolId
  id: ID!
  # swap Id for afterswap pairing
  swapId: String
  # pointer to transaction
  transaction: Transaction!
  # pointer to pool
  pool: Pool!
  # before-swap fields (set by handleAscntBeforeSwap, cleared after merge into Swap)
  # sqrt(price) of pool before swap, as Q64.96
  sqrtPriceX96Before: BigInt
  # illiquidity ratio before swap
  illiqBefore: BigInt
  # estimated volume in token1 before swap
  estimatedVolume1: BigInt
  # estimated price impact before swap
  estimatedPriceImpact: BigInt
  # decayed cumulative price impact before swap
  decayedCumPriceImpact: BigInt
  # dynamic fee in pips applied to swap
  dynamicFeePips: BigInt
}
